# Ollama Fine-tuning Configuration
# For penetration testing LLM (XSS, SQLi, OS Injection)

base_model:
  name: "qwen2.5-coder"      # Base model to fine-tune
  size: "3b"                 # Model size: 1b, 3b, 7b
  quantization: "q4_k_m"    # Quantization method

training:
  method: "qlora"            # Training method: lora, qlora, full
                             # qlora recommended for advanced dataset (larger context)
  lora_rank: 32              # Increased from 16 for more complex knowledge
  lora_alpha: 64             # alpha = 2 * rank
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"            # Include MLP layers for deeper knowledge
    - "up_proj"
    - "down_proj"

  # Hyperparameters
  learning_rate: 1.0e-4      # Lower LR for more complex domain knowledge
  num_epochs: 5              # More epochs for larger, diverse dataset
  batch_size: 2              # Reduced due to larger context window
  gradient_accumulation_steps: 8   # Effective batch = 16
  max_seq_length: 4096       # Increased for complex attack chain samples
  warmup_ratio: 0.05
  lr_scheduler: "cosine"
  weight_decay: 0.01

  # Memory optimization
  fp16: true
  bf16: false                # Set bf16: true if using Ampere+ GPU (A100/H100)
  gradient_checkpointing: true
  dataloader_num_workers: 2
  group_by_length: true      # Pad less; faster training with variable-length samples

dataset:
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  seed: 42
  max_samples: null         # null = use all samples

output:
  model_dir: "./output/models"
  checkpoint_dir: "./output/checkpoints"
  log_dir: "./output/logs"
  save_steps: 100
  eval_steps: 50
  logging_steps: 10

# Modelfile settings for Ollama
modelfile:
  system_prompt: |
    You are an elite penetration tester and offensive security researcher with deep
    expertise across the full web application attack surface. Your knowledge includes:

    - XSS (reflected, stored, DOM, mutation/mXSS, CSP bypass, prototype pollution,
      postMessage abuse, DOM clobbering, XS-Leaks)
    - SQL Injection (union, blind, OOB, second-order, NoSQL/MongoDB, GraphQL, ORM layers)
    - Server-Side Injection (SSTI in Jinja2/Twig/FreeMarker/Velocity, XXE with OOB
      exfiltration, SSRF with cloud IMDS exploitation, Java/Python/PHP deserialization)
    - Authentication attacks (JWT alg confusion/JWK injection, OAuth 2.0 flows,
      SAML XML Signature Wrapping, session fixation/puzzling)
    - Protocol-level attacks (HTTP request smuggling CL.TE/TE.CL, WebSocket CSWSH,
      race conditions, business logic flaws)
    - Multi-step attack chains combining the above for complete system compromise

    You assist authorized security professionals with vulnerability assessment,
    penetration testing methodology, exploit development, and remediation guidance.
    You operate strictly within authorized testing environments only and always
    provide defensive countermeasures alongside offensive techniques.
  temperature: 0.6
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  context_length: 8192       # Extended for complex multi-step attack chains
